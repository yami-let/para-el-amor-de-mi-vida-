<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="principal">

        <!-- Fondo -->
        <div class="nebulosa"></div>
        <div class="estrellas"></div>

        <!-- Contenido principal -->
        <div class="tarjeta">

            <!-- Foto de tu novia -->
            <div class="marco-foto">
                <img
                    src="imagenes/36cec233-1cf3-4840-b65d-f9f826ec3108.jpg"
                    alt="Mi amor"
                >
            </div>

            <!-- Texto -->
            <p class="toque">
         Para mi niña… toca la foto y a Hello Kitty para continuar ❤️
            </p>

            <!-- Hello Kitty -->
            <button id="entrar">

                <img
                    src="imagenes/6306384e489d9500dbe5b3c6cbb69093.jpg"
                    alt="Hello Kitty"
                >

            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
